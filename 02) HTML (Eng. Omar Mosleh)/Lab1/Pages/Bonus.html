<!DOCTYPE html>
<html lang="en">
<head>
    <title>Google Image Map</title>
</head>
<body style="background-image: url('Resources/Background.jpg'); font-family: Arial, sans-serif; text-align: center;">
    
    <h1>Welcome to the Bonus Page</h1>
    
    <img src="Resources/google.png" alt="Google Logo" usemap="#googlemap">

    <map name="googlemap">
        <area shape="rect" coords="0,0,50,100" href="https://www.google.com" alt="G1">
        <area shape="rect" coords="150,0,200,100" href="https://www.google.com" alt="G2">
    
        <area shape="rect" coords="50,0,100,100" href="https://www.w3schools.com" alt="O1">
        <area shape="rect" coords="100,0,150,100" href="https://www.w3schools.com" alt="O2">
    
        <area shape="rect" coords="200,0,250,100" href="https://www.youtube.com" alt="L">
    
        <area shape="rect" coords="250,0,300,100" href="https://www.twitter.com" alt="E">
    </map>

    </body>
    </html>
