<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 
    canvas => white paper ,paint
    context (obj) => cursor
    -->

    <canvas id="cas" width="800" height="600" style="background-color: gray">
    </canvas>

    <!--  draw using context obj  -->
    <script>
      // (1) canvas elemnt
      const canvas = document.getElementById("cas");
      // (2) need context (cursor)
      const context = canvas.getContext("2d");
      console.log(context);
      //   start of each shape
      context.beginPath(); // notify (بداية رسمة)
      context.moveTo(50, 50); // start point
      context.lineTo(150, 150);
      context.lineTo(50, 150);
      context.lineTo(50, 50);
      context.strokeStyle = "red";
      context.lineWidth = 10;
      context.lineJoin = "round";
      context.lineCap = "round";
      context.fillStyle = "green";
      context.fill();
      context.stroke();
      context.closePath();
      context.beginPath();
      context.moveTo(200, 200);
      context.lineTo(400, 400);
      context.stroke();
      context.closePath();
      context.beginPath();
      // angles != degree
      // angles = radian
      context.arc(
        300,
        300,
        100,
        (Math.PI / 180) * 0,
        (Math.PI / 180) * 180,
        true, // عكس العقارب
        // false, // مع العقارب
      );
      context.lineWidth = 2;
      context.stroke();
      context.fill();
      context.closePath();
      context.beginPath();
      //   context.rect(100, 100, 300, 200);
      //   context.stroke();
      //   context.lineWidth = 10;
      //   context.fillRect(100, 100, 300, 200);
      //   context.strokeRect(100, 100, 300, 200);
      //   context.fillStyle = "gray";
      //   context.fillRect(0, 0, canvas.width, canvas.height);
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.roundRect(100, 100, 300, 200, [70]);
      context.fill();
      context.closePath();
      context.beginPath();
      context.font = "50px sans-serif";
      context.fillText("MERN ALEX", 200, 100);
      context.closePath();
      context.beginPath();
      context.clearRect(0, 0, canvas.width, canvas.height);
      //   let grd = context.createLinearGradient(0, 0, 800, 600);
      //   let grd = context.createRadialGradient(300, 300, 100, 300, 300, 500);
      let grd = context.createConicGradient(Math.PI * 180, 300, 300);
      //   0 : 1
      grd.addColorStop(0, "red");
      grd.addColorStop(0.5, "green");
      grd.addColorStop(1, "yellow");
      context.fillStyle = grd;
      context.strokeStyle = grd;
      context.lineWidth = 50;
      context.fillRect(0, 0, canvas.width, canvas.height);
    </script>
  </body>
</html>
