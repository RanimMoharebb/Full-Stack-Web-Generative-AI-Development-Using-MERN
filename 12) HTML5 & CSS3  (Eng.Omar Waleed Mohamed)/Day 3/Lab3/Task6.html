<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 6</title>
    <style>
        
    .pacman {
  width: 0;
  height: 0;
  border-right: 60px solid transparent;
  border-top: 60px solid red;
  border-left: 60px solid red;
  border-bottom: 60px solid red;
  border-radius: 50%;
  animation: chomp 0.7s infinite ;
  
}

@keyframes chomp {
  0%   { border-right: 60px solid transparent; }
  50% { border-right: 60px solid red; }
}

   
    </style>
</head>
<body>
   <div id="circle" class="pacman"></div> 
   

</body>
</html>
