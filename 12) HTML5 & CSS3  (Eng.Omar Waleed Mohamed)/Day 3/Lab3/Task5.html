<!DOCTYPE html>
<html>
<head>
    <title>Blink Button</title>
    <style>
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        button{
            padding:10px 40px;
            border-radius:25px;
            border:2px solid blue;
            background-color:#cfd8dc;
            font-size:16px;
            cursor:pointer;
            transition:0.4s;
        }

        button:hover{
            background-color:#e1bee7;
            box-shadow:0 0 15px blue;
        }
    </style>
</head>
<body>

<button>Hover to Blink</button>

</body>
</html>
