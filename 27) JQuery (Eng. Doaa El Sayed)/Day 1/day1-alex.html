<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>
  <p>Hello World</p>

  <button id="hide"> Hide</button>
    <button id="show"> Show</button>

    <!-- fade  -->
     <!-- <div style="width:330px;height:200px;background-color:red;margin:3px" id="div1" ></div>
      <div style="width:330px;height:200px;background-color:green ;margin:3px" id="div2"></div>
       <div style="width:330px;height:200px;background-color:yellow ;margin:3px" id="div3"></div> -->

      <div style="width:300px;height:50px;background-color:green ;margin:3px" id="div4">click to slide</div>   
       <div style="width:300px;height:50px;background-color:green ;margin:3px;display:none" id="div5">my Name</div>   
<button id="stop"> stop</button>


       <div style="width:300px;height:50px;background-color:green ;margin:3px;position:absolute" class="div4"></div>
</body>
<script>
  $(".div4").click(function(){
    alert("clicked");
    $(".div4").animate({left:"500px"}).hide(2000)
    ;
  })

</script>
<script>
  $("#hide").click(function(){
    $("p").hide();
  })
  $("#show").click(function(){
    $("p").show();
  })
  $("#div1").mouseover(function(){
    $("#div2").fadeOut("slow,2000");
    $("#div3").fadeOut();
  })
    $("#div1").mouseout(function(){
      $("#div2").fadeIn("slow,2000");
      $("#div3").fadeIn();
    })
    $("#div4").click(function(){
      $("#div5").slideToggle(60000);
    })
    $("#stop").click(function(){
      $("#div5").stop();
    })

</script>

</html>
