<!DOCTYPE html>
<html>
<head>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

<div id="box" style="width:150px;height:100px;background:lightgray;"></div>
<button id="btn">Apply CSS</button>

<script>
$(document).ready(function () {
    $("#btn").click(function () {
        $("#box").css("border", "3px solid red");
    });
});
</script>

</body>
</html>
