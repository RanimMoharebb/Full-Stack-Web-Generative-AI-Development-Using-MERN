<!DOCTYPE html>
<html>
<head>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>

<img id="tiger" src="tiger.gif" width="120" style="position:absolute; left:500px;">

<script>
$(document).ready(function () {

    $("#tiger").click(function () {
        $(this).animate({ left: "0px" }, 3000, function () {
            $(this).fadeOut();
        });
    });

});
</script>

</body>
</html>
