<!DOCTYPE html>
<html>
<head>
    <title>QUnit Demo</title>

    <link rel="stylesheet" href="https://code.jquery.com/qunit/qunit-2.20.1.css">
    <script src="https://code.jquery.com/qunit/qunit-2.20.1.js"></script>
</head>

<body>

<h2>QUnit Unit Testing Demo</h2>

<div id="qunit"></div>
<div id="qunit-fixture"></div>

<script>
function add(a, b) {
    return a + b;
}

QUnit.test("Addition Test", function (assert) {
    assert.equal(add(2, 3), 5, "2 + 3 = 5");
    assert.equal(add(-1, 1), 0, "-1 + 1 = 0");
});
</script>

</body>
</html>
