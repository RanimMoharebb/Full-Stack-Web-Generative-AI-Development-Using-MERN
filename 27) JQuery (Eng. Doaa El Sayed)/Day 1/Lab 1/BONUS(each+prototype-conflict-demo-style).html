<!DOCTYPE html>
<html>
<head>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>

<ul>
<li>A</li>
<li>B</li>
<li>C</li>
</ul>

<button id="run">each demo</button>

<script>
$(document).ready(function () {

    $("#run").click(function () {
        $("li").each(function (i, el) {
            $(el).css("color", "blue");
            console.log(i + " " + $(el).text());
        });
    });

});
</script>

</body>
</html>
