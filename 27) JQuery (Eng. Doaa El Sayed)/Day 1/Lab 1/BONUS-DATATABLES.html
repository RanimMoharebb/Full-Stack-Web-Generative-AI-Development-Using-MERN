<!DOCTYPE html>
<html>
<head>
    <title>DataTables Demo</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- DataTables CDN -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
</head>

<body>

<h2>DataTables Plugin Demo</h2>

<table id="myTable" border="1">
    <thead>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
    </thead>

    <tbody>
        <tr><td>Ahmed</td><td>20</td><td>Alexandria</td></tr>
        <tr><td>Ali</td><td>22</td><td>Cairo</td></tr>
        <tr><td>Sara</td><td>21</td><td>Giza</td></tr>
        <tr><td>Omar</td><td>23</td><td>Alexandria</td></tr>
    </tbody>
</table>

<script>
$(document).ready(function () {
    $("#myTable").DataTable();
});
</script>

</body>
</html>
