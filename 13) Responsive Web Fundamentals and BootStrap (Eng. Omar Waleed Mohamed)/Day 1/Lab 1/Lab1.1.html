<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab1.1 - Task 1</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-size: 20px;
        }

        h2 {
            margin: 40px;
            font-size: 50px;
            font-weight: 300;
            color: brown;
        }

        /* Task 1 Styles */
        .navbar {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            background: rgb(216, 216, 216);
            padding: 20px;
            margin: 10px 40px;
        }

        .navbar div {
            flex: 1 1 150px;
            text-align: center;
        }

        .flex-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 10px 80px;
        }

        .card {
            flex: 1 1 300px;
            border: 2px solid black;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card .content {
            padding: 20px;
            text-align: center;
        }

        .card .footer {
            background: rgb(216, 216, 216);
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>Task 1</h2>

    <div class="navbar">
        <div>Home</div>
        <div>About</div>
        <div>Services</div>
        <div>Contact</div>
    </div>

    <div class="flex-container">
        <div class="card">
            <div class="content">
                This is a flex item.
            </div>
            <div class="footer">Footer</div>
        </div>

        <div class="card">
            <div class="content">
                Lorem ipsum dolor sit amet consectetur adipisicing elit. In cum nam quisquam quo voluptatibus.
            </div>
            <div class="footer">Footer</div>
        </div>
    </div>

</body>
</html>
