<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab1.3 - Task 3</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-size: 20px;
        }

        h2 {
            margin: 40px;
            font-size: 50px;
            font-weight: 300;
            color: brown;
        }

        /* Task 1 */
        .navbar {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;   
            background: rgb(216, 216, 216);
            padding: 20px;
            margin: 10px 40px;
        }

        .navbar div {
            flex: 1 1 150px;    
            font-size: 20px;
            text-align: center;
        }

        .flex-container {
            display: flex;
            flex-wrap: wrap;   
            gap: 20px;
            margin: 10px 80px;
        }

        .card {
            flex: 1 1 300px;
            border: 2px solid black;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card .content {
            padding: 20px;
            text-align: center;

        }

        .card .footer {
            background: rgb(216, 216, 216);
            padding: 10px;
            text-align: center;
        }

        /* Task 2 */
        .task-two-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vmin;
            width: 100vmin;
            margin: 40px;
            border: 4px solid black;
        }

        .center-item {
            width: 25%;
            height: 10%;
            border: 5px solid orange;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
        }

        /* Task 3 */
        .layout {
            display: flex;
            flex-wrap: wrap;   
            flex-direction: column;
            margin: 40px;
            gap: 6px;
        }

        .header,
        .footer-main {
            background: rgb(88, 117, 179);
            color: white;
            text-align: center;
            padding: 25px;
        }


        .middle {
            display: flex;
            flex-wrap: wrap;   
            min-height: 300px;
            gap: 6px;
            background: white;
        }

        .sidenav {
            flex: 1 1 125px;
            background: rgb(180,93,34);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-content {
            flex: 2 1 250px;
            background: #7fa33a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sidebar {
            flex: 1 1 125px;
            background: rgb(180,93,34);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>


    <h2>Task 3</h2>

    <div class="layout">
        <div class="header">HEADER</div>

        <div class="middle">
            <div class="sidenav">SIDENAV</div>
            <div class="main-content">MAIN CONTENT</div>
            <div class="sidebar">SIDEBAR</div>
        </div>

        <div class="footer-main">FOOTER</div>
    </div>

</body>

</html>
