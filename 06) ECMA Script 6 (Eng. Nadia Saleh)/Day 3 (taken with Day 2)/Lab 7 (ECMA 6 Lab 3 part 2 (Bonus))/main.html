<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Table</title>
<link rel="stylesheet" href="main.css">
</head>
<body>
<div class="container">
    <h1>Employee Manager</h1>
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search...">
        <select id="rowsPerPage">
            <option value="5">5 per page</option>
            <option value="10">10 per page</option>
            <option value="20" selected>20 per page</option>
        </select>
        <button id="addBtn">Add Employee</button>
    </div>

    <table id="employeeTable">
        <thead>
            <tr>
                <th data-key="name">Name</th>
                <th data-key="id">ID</th>
                <th data-key="position">Position</th>
                <th data-key="office">Office</th>
                <th data-key="age">Age</th>
                <th data-key="startDate">Start Date</th>
                <th data-key="salary">Salary</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div id="pagination"></div>
</div>

<!-- Modal for Add/Edit -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <h2 id="modalTitle">Add Employee</h2>
        <form id="employeeForm">
            <input type="text" name="name" placeholder="Name" required>
            <input type="text" name="id" placeholder="ID" required>
            <input type="text" name="position" placeholder="Position" required>
            <input type="text" name="office" placeholder="Office" required>
            <input type="number" name="age" placeholder="Age" required>
            <input type="date" name="startDate" required>
            <input type="number" name="salary" placeholder="Salary" required>
            <button type="submit">Save</button>
        </form>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
