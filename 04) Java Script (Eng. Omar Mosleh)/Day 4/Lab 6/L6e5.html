<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ex5 - Fetch users.json</title>
    <style>
      body { font-family: system-ui, Arial; padding: 16px; }
      .error { color: #b00020; }
      .user { border: 1px solid #ddd; border-radius: 10px; padding: 10px; margin: 10px 0; }
    </style>
  </head>
  <body>
    <h1>Fetch Users</h1>
    <button id="load">Load Users</button>
    <div id="status"></div>
    <div id="users"></div>

    <script>
      const loadBtn = document.querySelector('#load');
      const statusEl = document.querySelector('#status');
      const usersEl = document.querySelector('#users');

      loadBtn.addEventListener('click', async () => {
        statusEl.textContent = 'Loading...';
        statusEl.className = '';
        usersEl.innerHTML = '';

        try 
        {
          // TODO: fetch './users.json'
          const res = await fetch('./users.json');
          
          // TODO: if !res.ok throw Error
          if (!res.ok) {
            throw new Error('Request failed');
          }

          // TODO: const data = await res.json()
          const data = await res.json();

          // TODO: render data
          for (let i = 0; i < data.length; i++) 
          {
            const div = document.createElement('div');
            div.className = 'user';
            div.textContent = data[i].name + ' - ' + data[i].email;
            usersEl.insertAdjacentElement('beforeend', div);
          }

          statusEl.textContent = 'Done';
        } 
        catch (err) 
        {
          statusEl.textContent = 'Failed to load users.';
          statusEl.className = 'error';
          console.error(err);
        }
      });
    </script>
  </body>
</html>
